# --------------------------------------------------------
# SEEM Demo Configuration for Custom Organisms V2
# Demo version with seem_model_demo for interactive inference
# --------------------------------------------------------

# Define Test/Trainer/Saving
PIPELINE: XDecoderPipeline
TRAINER: xdecoder
SAVE_DIR: './finetune_output/custom_organisms_v2_finetune'
base_path: "./"

# Resume Logistic
RESUME: false
WEIGHT: true
RESUME_FROM: 'seem_focall_v0.pt'  # Using the existing SEEM model
EVAL_AT_START: False

# Logging and Debug
WANDB: False
LOG_EVERY: 50
FIND_UNUSED_PARAMETERS: false

# Speed up training
FP16: true
PORT: '12355'

# misc
LOADER:
  JOINT: False
  KEY_DATASET: 'custom_organisms_v2'

##################
# Task settings
##################
VERBOSE: true
MODEL:
  NAME: seem_model_demo  # Changed to seem_model_demo for demo compatibility
  HEAD: xdecoder_head
  MASK_ON: false
  KEYPOINT_ON: false
  LOAD_PROPOSALS: false
  DIM_PROJ: 512
  TEXT:
    ARCH: vlpencoder
    NAME: transformer
    TOKENIZER: clip
    CONTEXT_LENGTH: 77
    WIDTH: 512
    HEADS: 8
    LAYERS: 12
    AUTOGRESSIVE: True
  BACKBONE:
    NAME: focal
    PRETRAINED: ''
    LOAD_PRETRAINED: false
    FOCAL:
      PRETRAIN_IMG_SIZE: 224
      PATCH_SIZE: 4
      EMBED_DIM: 192
      DEPTHS: [2, 2, 18, 2]
      FOCAL_LEVELS: [4, 4, 4, 4]
      FOCAL_WINDOWS: [3, 3, 3, 3]
      DROP_PATH_RATE: 0.3
      MLP_RATIO: 4.0
      DROP_RATE: 0.0
      PATCH_NORM: True
      USE_CONV_EMBED: True
      SCALING_MODULATOR: True
      USE_CHECKPOINT: False
      USE_POSTLN: true
      USE_POSTLN_IN_MODULATION: false
      USE_LAYERSCALE: True
      OUT_FEATURES: ["res2", "res3", "res4", "res5"]
      OUT_INDICES: [0, 1, 2, 3]
  ENCODER:
    NAME: transformer_encoder_fpn
    IGNORE_VALUE: 255
    NUM_CLASSES: 6  # Updated for 6 classes: celegan, drosophila, fish, blackmouse, rat, whitemouse (background is handled separately)
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 512
    MASK_DIM: 512
    NORM: "GN"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  DECODER:
    NAME: seem_demo  # Changed to seem_demo for demo compatibility
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    MASK:
      ENABLED: True
    DETECTION: False
    SPATIAL:
      ENABLED: True
      MAX_ITER: 3
    GROUNDING:
      ENABLED: True
      MAX_LEN: 5
      TEXT_WEIGHT: 2.0
      CLASS_WEIGHT: 0.5
    VISUAL:
      ENABLED: True
    AUDIO:
      ENABLED: True
    RETRIEVAL:
      ENABLED: False
    LVIS:
      ENABLED: True
      THRES: 0.7
    OPENIMAGE:
      ENABLED: False
      NEGATIVE_SAMPLES: 5
      GROUNDING:
        ENABLED: False
        MAX_LEN: 5
    CAPTION:
      ENABLED: False
      PHRASE_PROB: 0.5
      SIM_THRES: 0.95
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    GCLASS_WEIGHT: 0.4
    GMASK_WEIGHT: 1.0
    GDICE_WEIGHT: 1.0
    SCLASS_WEIGHT: 0.4
    SMASK_WEIGHT: 1.0
    SDICE_WEIGHT: 1.0
    OCLASS_WEIGHT: 0.4
    OMASK_WEIGHT: 1.0
    ODICE_WEIGHT: 1.0
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BBOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    CAPTION_WEIGHT: 2.0
    COST_SPATIAL:
      CLASS_WEIGHT: 5.0
      MASK_WEIGHT: 2.0
      DICE_WEIGHT: 2.0
    HIDDEN_DIM: 512
    NUM_OBJECT_QUERIES: 101
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    MAX_SPATIAL_LEN: [512, 512, 512, 512]
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    DEC_LAYERS: 10
    TOP_GROUNDING_LAYERS: 10
    TOP_CAPTION_LAYERS: 10
    TOP_SPATIAL_LAYERS: 10
    TOP_OPENIMAGE_LAYERS: 10
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: True
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8
      SEM_SEG_POSTPROCESSING_BEFORE_INFERENCE: false
      DETECTIONS_PER_IMAGE: 100

# Dataset Configuration
DATASETS:
  TRAIN: ["custom_organisms_v2_train"]
  TEST: ["custom_organisms_v2_val"]
  CLASS_CONCAT: false
  SIZE_DIVISIBILITY: 32
  PROPOSAL_FILES_TRAIN: []

# Input Configuration
INPUT:
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  MIN_SIZE_TRAIN: 512
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TRAIN_SAMPLING: 'choice'
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 1024
  IMAGE_SIZE: 1024
  MIN_SCALE: 0.1
  MAX_SCALE: 2.0
  DATASET_MAPPER_NAME: "mask_former_panoptic_spatial"  # Use spatial-aware mapper
  IGNORE_VALUE: 255
  COLOR_AUG_SSD: False
  SIZE_DIVISIBILITY: 32
  RANDOM_FLIP: "horizontal"
  MASK_FORMAT: "polygon"
  FORMAT: "RGB"
  CROP:
    ENABLED: True
    TYPE: 'absolute_range'
    SIZE: (512, 512)
    SINGLE_CATEGORY_MAX_AREA: 1.0

# Training Configuration
SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.0001
  STEPS: [0.88889, 0.96296]
  MAX_ITER: 3000
  GAMMA: 0.1
  WARMUP_FACTOR: 1.0 / 1000
  WARMUP_ITERS: 1000
  WARMUP_METHOD: "linear"
  CHECKPOINT_PERIOD: 500
  IMS_PER_BATCH_TEST: 1

# Evaluation Configuration
TEST:
  EVAL_PERIOD: 500
  AUG:
    ENABLED: False
    MIN_SIZES: (400, 500, 600, 700, 800, 900, 1000, 1100, 1200)
    MAX_SIZE: 4000
    FLIP: True

# Multi-modal Architecture
ATTENTION_ARCH:
  NUM_LAYERS: 10  # Add number of layers
  VARIABLE:
    queries: ['object', 'grounding', 'spatial']
    tokens: ['grounding', 'spatial', 'visual', 'audio']
  SELF_ATTENTION:
    queries:
      object: ['queries_object', 'tokens_grounding', 'tokens_spatial', 'tokens_visual', 'tokens_audio']
      grounding: ['queries_object', 'tokens_grounding']
      spatial: ['tokens_spatial']
    tokens:
      grounding: ['queries_object', 'tokens_grounding']
      spatial: ['tokens_spatial']
      visual: ['tokens_visual']
      audio: ['queries_object', 'tokens_audio']
  CROSS_ATTENTION:
    queries:
      object: True
      grounding: True
      spatial: True
    tokens:
      grounding: False
      spatial: False
      visual: False
      audio: False
  MASKING: ['tokens_spatial', 'tokens_grounding', 'tokens_visual', 'tokens_audio']
  DUPLICATION:
    queries:
      grounding: 'queries_object'
      spatial: 'queries_object'
  SPATIAL_MEMORIES: 32
  QUERY_NUMBER: 3

# Model Registry
# MODEL_REGISTRY: "modeling.architectures.seem_model_v1"  # Use standard SEEM model architecture 